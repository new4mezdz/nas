<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档编辑器</title>
    <!-- Excel 相关 -->
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css' />
    <!-- Word 相关 -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        #app { height: 100%; display: flex; flex-direction: column; }
        #toolbar {
            height: 40px; background: #f5f5f5; border-bottom: 1px solid #ddd;
            display: flex; align-items: center; padding: 0 15px; justify-content: space-between;
        }
        #sheet-container { flex: 1; position: relative; width: 100%; display: none; }
        #word-container { flex: 1; overflow: auto; background: #fff; display: none; }
        #word-editor { height: 100%; }
        .ql-container { font-size: 14px; border: none !important; }
        .ql-editor { min-height: 100%; padding: 40px 60px; }
        .ql-toolbar { border-left: none !important; border-right: none !important; border-top: none !important; }
        .btn {
            padding: 6px 16px; background: #4b89ff; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .btn:hover { background: #3370ff; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        #status { font-size: 12px; color: #666; margin-right: 10px; }
        .luckysheet-icon { padding-bottom: 0px !important; }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <div id="title" style="font-weight: bold; color: #333;">📄 文档编辑器</div>
            <div>
                <span id="status">准备就绪</span>
                <button id="save-btn" class="btn" onclick="saveFile()">💾 保存 (Ctrl+S)</button>
            </div>
        </div>
        <!-- Excel 容器 -->
        <div id="sheet-container"></div>
        <!-- Word 容器 -->
        <div id="word-container">
            <div id="word-editor"></div>
        </div>
    </div>

    <!-- Excel 相关 JS -->
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/luckysheet.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckyexcel/dist/luckyexcel.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <!-- Word 相关 JS -->
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>

    <script>
        var currentFilePath = '';
        var authToken = '';
        var baseUrl = '';
        var fileType = ''; // 'excel' 或 'word'
        var quill = null;

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            currentFilePath = params.get('path');
            authToken = params.get('token');
            baseUrl = params.get('baseUrl') || '';

            if (!currentFilePath || !authToken) {
                alert("❌ 参数缺失: 无法加载文件");
                return;
            }

            // 根据扩展名判断文件类型
            const ext = currentFilePath.split('.').pop().toLowerCase();
            if (ext === 'xlsx' || ext === 'xls') {
                fileType = 'excel';
                document.getElementById('title').innerHTML = '📊 表格编辑器';
                document.getElementById('sheet-container').style.display = 'block';
            } else if (ext === 'docx' || ext === 'doc') {
                fileType = 'word';
                document.getElementById('title').innerHTML = '📄 文档编辑器';
                document.getElementById('word-container').style.display = 'block';
                // 初始化 Quill
                quill = new Quill('#word-editor', {
                    theme: 'snow',
                    modules: {
                        toolbar: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'color': [] }, { 'background': [] }],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            [{ 'align': [] }],
                            ['link', 'image'],
                            ['clean']
                        ]
                    }
                });
            } else {
                alert("❌ 不支持的文件格式");
                return;
            }

            loadFile();
        }

        async function loadFile() {
            setStatus("正在下载文件...", "blue");
            try {
                const response = await fetch(`${baseUrl}/api/download?path=${encodeURIComponent(currentFilePath)}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                if (fileType === 'excel') {
                    await loadExcel(response);
                } else if (fileType === 'word') {
                    await loadWord(response);
                }
            } catch (e) {
                console.error(e);
                alert("加载失败: " + e.message);
                setStatus("加载失败", "red");
            }
        }

        async function loadExcel(response) {
            const blob = await response.blob();
            setStatus("正在解析 Excel...", "blue");

            LuckyExcel.transformExcelToLucky(blob, function(exportJson, luckysheetfile){
                if(exportJson.sheets == null || exportJson.sheets.length == 0){
                    alert("文件读取失败或格式不支持");
                    return;
                }

                luckysheet.create({
                    container: 'sheet-container',
                    showinfobar: false,
                    data: exportJson.sheets,
                    title: exportJson.info?.name || '',
                    userInfo: exportJson.info?.creator || '',
                    lang: 'zh',
                    allowUpdate: true,
                    loadUrl: "",
                });

                setStatus("加载完成", "green");
            });
        }

        async function loadWord(response) {
            const arrayBuffer = await response.arrayBuffer();
            setStatus("正在解析文档...", "blue");

            const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
            quill.root.innerHTML = result.value;
            setStatus("加载完成", "green");
        }

        async function saveFile() {
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = "正在保存...";

            try {
                let blob;
                let mimeType;

                if (fileType === 'excel') {
                    blob = await saveExcel();
                    mimeType = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
                } else if (fileType === 'word') {
                    blob = await saveWord();
                    mimeType = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
                }

                // 上传
                setStatus("正在上传...", "blue");
                const formData = new FormData();
                const fileName = currentFilePath.split('/').pop();
                const file = new File([blob], fileName, { type: mimeType });

                formData.append('file', file);

                let parentDir = currentFilePath.replace(/\\/g, '/');
                parentDir = parentDir.substring(0, parentDir.lastIndexOf('/'));
                if(!parentDir) parentDir = '/';
                formData.append('path', parentDir);

                const res = await fetch(`${baseUrl}/api/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });

                const result = await res.json();
                if (result.success) {
                    setStatus("✅ 已保存 " + new Date().toLocaleTimeString(), "green");
                } else {
                    throw new Error(result.error);
                }
            } catch (e) {
                console.error(e);
                alert("保存失败: " + e.message);
                setStatus("保存失败", "red");
            } finally {
                btn.disabled = false;
                btn.innerText = "💾 保存 (Ctrl+S)";
            }
        }

        async function saveExcel() {
            setStatus("正在生成 Excel...", "blue");
            const sheets = luckysheet.getAllSheets();
            const workbook = new ExcelJS.Workbook();

            sheets.forEach(function(sheet) {
                if(sheet.data.length === 0) return;
                const worksheet = workbook.addWorksheet(sheet.name);

                for(let r = 0; r < sheet.data.length; r++){
                    const row = sheet.data[r];
                    if(!row) continue;

                    const rowData = [];
                    for(let c = 0; c < row.length; c++){
                        const cell = row[c];
                        let val = cell ? (cell.v !== undefined ? cell.v : cell.m) : null;
                        rowData.push(val);
                    }
                    worksheet.addRow(rowData);
                }
            });

            const buffer = await workbook.xlsx.writeBuffer();
            return new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        }

        async function saveWord() {
            setStatus("正在生成文档...", "blue");
            const htmlContent = quill.root.innerHTML;
            const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${htmlContent}</body></html>`;
            return htmlDocx.asBlob(fullHtml);
        }

        function setStatus(text, color) {
            const el = document.getElementById('status');
            el.innerText = text;
            el.style.color = color === 'red' ? '#ff4d4f' : (color === 'green' ? '#52c41a' : '#1890ff');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
        });
    </script>
</body>
</html>
