<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyOffice 文档编辑 - NAS</title>
    <!-- 使用本地 OnlyOffice API -->
    <script src="http://localhost:80/web-apps/apps/api/documents/api.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
        }
        
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toolbar {
            background: white;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #3498db;
            color: white;
        }
        
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.8;
        }
        
        .document-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }
        
        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status.online {
            background: #27ae60;
            color: white;
        }
        
        .status.offline {
            background: #e74c3c;
            color: white;
        }
        
        #placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #7f8c8d;
        }
        
        #editor {
            width: 100%;
            height: calc(100vh - 120px);
            border: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: black;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>OnlyOffice 文档编辑器</h1>
        <div class="user-info">
            <span id="currentUser"></span>
            <span class="status" id="connectionStatus">离线</span>
            <button class="btn btn-secondary" onclick="goBack()">返回</button>
        </div>
    </div>
    
    <div class="toolbar">
        <button class="btn btn-primary" onclick="saveDocument()">保存</button>
        <button class="btn btn-secondary" onclick="showShareDialog()">分享</button>
        <button class="btn btn-secondary" onclick="downloadDocument()">下载</button>
        
        <div class="document-info">
            <span id="documentName">未选择文档</span>
            <span id="documentType"></span>
        </div>
    </div>
    
    <div id="placeholder">
        <h2>请选择要编辑的文档</h2>
        <p>或者创建一个新文档开始编辑</p>
        <div id="status" style="margin: 20px 0; padding: 10px; background: #f8f9fa; border-radius: 4px; text-align: center;">
            正在加载 OnlyOffice API...
        </div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
            <button class="btn btn-primary" onclick="showCreateDialog()">创建新文档</button>
            <button class="btn btn-success" onclick="showUploadDialog()">上传文档</button>
        </div>
    </div>
    
    <div id="editor"></div>
    
    <!-- 创建文档对话框 -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>创建新文档</h3>
                <span class="close" onclick="closeCreateDialog()">&times;</span>
            </div>
            <div class="form-group">
                <label for="fileName">文件名:</label>
                <input type="text" id="fileName" placeholder="请输入文件名">
            </div>
            <div class="form-group">
                <label for="fileType">文档类型:</label>
                <select id="fileType">
                    <option value=".docx">Word 文档 (.docx)</option>
                    <option value=".xlsx">Excel 表格 (.xlsx)</option>
                    <option value=".pptx">PowerPoint 演示文稿 (.pptx)</option>
                    <option value=".txt">文本文档 (.txt)</option>
                </select>
            </div>
            <div class="form-group">
                <button class="btn btn-primary" onclick="createDocument()">创建</button>
                <button class="btn btn-secondary" onclick="closeCreateDialog()">取消</button>
            </div>
            <div id="createError" class="error"></div>
        </div>
    </div>
    
    <!-- 上传文档对话框 -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>上传文档</h3>
                <span class="close" onclick="closeUploadDialog()">&times;</span>
            </div>
            <div class="form-group">
                <label for="uploadFile">选择文件:</label>
                <input type="file" id="uploadFile" accept=".doc,.docx,.odt,.rtf,.txt,.xls,.xlsx,.ods,.ppt,.pptx,.odp">
                <small style="color: #666; display: block; margin-top: 5px;">
                    支持格式: Word(.doc/.docx/.odt/.rtf/.txt), Excel(.xls/.xlsx/.ods), PowerPoint(.ppt/.pptx/.odp)
                </small>
            </div>
            <div class="form-group">
                <button class="btn btn-primary" onclick="uploadDocument()">上传</button>
                <button class="btn btn-secondary" onclick="closeUploadDialog()">取消</button>
            </div>
            <div id="uploadError" class="error"></div>
            <div id="uploadSuccess" class="success"></div>
        </div>
    </div>

    <!-- 分享文档对话框 -->
    <div id="shareModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>分享文档</h3>
                <span class="close" onclick="closeShareDialog()">&times;</span>
            </div>
            <div class="form-group">
                <label for="shareUsername">用户名:</label>
                <input type="text" id="shareUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="sharePermission">权限:</label>
                <select id="sharePermission">
                    <option value="read">只读</option>
                    <option value="write">读写</option>
                    <option value="comment">评论</option>
                    <option value="fill">填写表单</option>
                </select>
            </div>
            <div class="form-group">
                <button class="btn btn-primary" onclick="shareDocument()">分享</button>
                <button class="btn btn-secondary" onclick="closeShareDialog()">取消</button>
            </div>
            <div id="shareError" class="error"></div>
            <div id="shareSuccess" class="success"></div>
        </div>
    </div>

    <script>
        let currentDocId = null;
        let docEditor = null;
        let token = localStorage.getItem('token');
        
        // 检查 OnlyOffice API 是否加载
        function checkOnlyOfficeAPI() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 10;
                
                const check = () => {
                    attempts++;
                    console.log(`检查 OnlyOffice API (尝试 ${attempts}/${maxAttempts})`);
                    
                    if (typeof DocsAPI !== 'undefined') {
                        console.log('OnlyOffice API 加载成功');
                        resolve(true);
                    } else if (attempts >= maxAttempts) {
                        console.error('OnlyOffice API 加载失败');
                        reject(new Error('OnlyOffice API 加载超时'));
                    } else {
                        setTimeout(check, 500);
                    }
                };
                
                check();
            });
        }
        
        // 页面初始化函数
        function initializePage() {
            // 检查登录状态
            if (!token) {
                alert('请先登录');
                window.location.href = '/';
                return;
            }
            
            // 显示当前用户
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('currentUser').textContent = user.username || '未知用户';
            
            // 从URL参数获取文档ID
            const urlParams = new URLSearchParams(window.location.search);
            const docId = urlParams.get('doc_id');
            
            if (docId) {
                loadDocument(docId);
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 等待 OnlyOffice API 加载
            checkOnlyOfficeAPI()
                .then(() => {
                    document.getElementById('status').innerHTML = '✅ OnlyOffice API 加载成功';
                    initializePage();
                })
                .catch((error) => {
                    console.error('OnlyOffice API 加载失败:', error);
                    document.getElementById('status').innerHTML = '❌ OnlyOffice API 加载失败，请检查本地 OnlyOffice 服务是否运行<br>错误: ' + error.message;
                });
        });
        
        // 加载文档
        async function loadDocument(docId) {
            try {
                const response = await fetch(`/api/onlyoffice/documents/${docId}/config`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('获取文档配置失败');
                }
                
                const config = await response.json();
                currentDocId = docId;
                
                // 隐藏占位符
                document.getElementById('placeholder').style.display = 'none';
                
                // 显示编辑器
                document.getElementById('editor').style.display = 'block';
                
                // 更新文档信息
                document.getElementById('documentName').textContent = config.document.title;
                document.getElementById('documentType').textContent = config.documentType;
                
                // 初始化OnlyOffice编辑器
                initEditor(config);
                
            } catch (error) {
                console.error('加载文档失败:', error);
                alert('加载文档失败: ' + error.message);
            }
        }
        
        // 初始化OnlyOffice编辑器
        function initEditor(config) {
            try {
                if (docEditor) {
                    docEditor.destroyEditor();
                }
                
                // 检查 DocsAPI 是否可用
                if (typeof DocsAPI === 'undefined') {
                    throw new Error('OnlyOffice API 未加载');
                }
                
                console.log('开始初始化 OnlyOffice 编辑器...');
                console.log('配置信息:', config);
                
                // 简化配置，移除可能导致问题的选项
                const simplifiedConfig = {
                    ...config,
                    editorConfig: {
                        ...config.editorConfig,
                        // 移除可能导致问题的自定义配置
                        customization: {
                            autosave: true,
                            forcesave: true,
                            comments: true,
                            zoom: 100
                        }
                    }
                };
                
                console.log('简化后的配置:', simplifiedConfig);
                
                // 尝试创建编辑器
                docEditor = new DocsAPI.DocEditor("editor", simplifiedConfig);
                console.log('DocEditor 对象创建成功:', docEditor);
                
                // 检查编辑器对象的结构
                if (!docEditor) {
                    throw new Error('DocEditor 对象创建失败');
                }
                
                console.log('DocEditor 属性:', Object.keys(docEditor));
                console.log('DocEditor events:', docEditor.events);
                
                // 尝试设置事件监听器，但不强制要求
                if (docEditor.events) {
                    console.log('设置事件监听器...');
                    setupEventListeners();
                } else {
                    console.warn('docEditor.events 不可用，跳过事件监听器设置');
                    // 不报错，继续使用编辑器
                    document.getElementById('connectionStatus').textContent = '在线（无事件监听）';
                    document.getElementById('connectionStatus').className = 'status online';
                }
                
                console.log('OnlyOffice 编辑器初始化完成');
                
            } catch (error) {
                console.error('初始化编辑器失败:', error);
                document.getElementById('connectionStatus').textContent = '初始化失败';
                document.getElementById('connectionStatus').className = 'status offline';
                alert('初始化编辑器失败: ' + error.message);
            }
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            try {
                if (!docEditor || !docEditor.events) {
                    console.error('无法设置事件监听器：docEditor 或 events 不可用');
                    return;
                }
                
                // 监听编辑器事件
                docEditor.events.on('onDocumentReady', function() {
                    console.log('文档已加载');
                    document.getElementById('connectionStatus').textContent = '在线';
                    document.getElementById('connectionStatus').className = 'status online';
                });
                
                docEditor.events.on('onError', function(event) {
                    console.error('编辑器错误:', event);
                    document.getElementById('connectionStatus').textContent = '错误';
                    document.getElementById('connectionStatus').className = 'status offline';
                });
                
                console.log('事件监听器设置成功');
                
            } catch (error) {
                console.error('设置事件监听器失败:', error);
            }
        }
        
        // 保存文档
        function saveDocument() {
            if (docEditor) {
                docEditor.executeCommand('save');
            }
        }
        
        // 下载文档
        async function downloadDocument() {
            if (!currentDocId) {
                alert('请先选择文档');
                return;
            }
            
            try {
                const response = await fetch(`/api/onlyoffice/download/${currentDocId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('下载失败');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = document.getElementById('documentName').textContent;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
            } catch (error) {
                console.error('下载失败:', error);
                alert('下载失败: ' + error.message);
            }
        }
        
        // 显示创建文档对话框
        function showCreateDialog() {
            document.getElementById('createModal').style.display = 'block';
        }
        
        // 关闭创建文档对话框
        function closeCreateDialog() {
            document.getElementById('createModal').style.display = 'none';
            document.getElementById('createError').textContent = '';
        }
        
        // 显示上传文档对话框
        function showUploadDialog() {
            document.getElementById('uploadModal').style.display = 'block';
        }
        
        // 关闭上传文档对话框
        function closeUploadDialog() {
            document.getElementById('uploadModal').style.display = 'none';
            document.getElementById('uploadError').textContent = '';
            document.getElementById('uploadSuccess').textContent = '';
            document.getElementById('uploadFile').value = '';
        }
        
        // 上传文档
        async function uploadDocument() {
            const fileInput = document.getElementById('uploadFile');
            const file = fileInput.files[0];
            
            if (!file) {
                document.getElementById('uploadError').textContent = '请选择文件';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/api/onlyoffice/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('uploadSuccess').textContent = '上传成功！正在加载文档...';
                    document.getElementById('uploadError').textContent = '';
                    
                    // 延迟关闭对话框并加载文档
                    setTimeout(() => {
                        closeUploadDialog();
                        loadDocument(data.doc_id);
                    }, 1500);
                } else {
                    document.getElementById('uploadError').textContent = data.error || '上传失败';
                    document.getElementById('uploadSuccess').textContent = '';
                }
                
            } catch (error) {
                console.error('上传失败:', error);
                document.getElementById('uploadError').textContent = '上传失败: ' + error.message;
                document.getElementById('uploadSuccess').textContent = '';
            }
        }
        
        // 创建文档
        async function createDocument() {
            const fileName = document.getElementById('fileName').value.trim();
            const fileType = document.getElementById('fileType').value;
            
            if (!fileName) {
                document.getElementById('createError').textContent = '请输入文件名';
                return;
            }
            
            try {
                const response = await fetch('/api/onlyoffice/documents', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        file_name: fileName + fileType,
                        file_type: fileType
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    closeCreateDialog();
                    loadDocument(data.document_id);
                } else {
                    document.getElementById('createError').textContent = data.error || '创建失败';
                }
                
            } catch (error) {
                console.error('创建文档失败:', error);
                document.getElementById('createError').textContent = '创建失败: ' + error.message;
            }
        }
        
        // 显示分享对话框
        function showShareDialog() {
            if (!currentDocId) {
                alert('请先选择文档');
                return;
            }
            document.getElementById('shareModal').style.display = 'block';
        }
        
        // 关闭分享对话框
        function closeShareDialog() {
            document.getElementById('shareModal').style.display = 'none';
            document.getElementById('shareError').textContent = '';
            document.getElementById('shareSuccess').textContent = '';
        }
        
        // 分享文档
        async function shareDocument() {
            const username = document.getElementById('shareUsername').value.trim();
            const permission = document.getElementById('sharePermission').value;
            
            if (!username) {
                document.getElementById('shareError').textContent = '请输入用户名';
                return;
            }
            
            try {
                const response = await fetch(`/api/onlyoffice/documents/${currentDocId}/share`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        username: username,
                        permission_type: permission
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('shareSuccess').textContent = data.message;
                    document.getElementById('shareError').textContent = '';
                } else {
                    document.getElementById('shareError').textContent = data.error || '分享失败';
                    document.getElementById('shareSuccess').textContent = '';
                }
                
            } catch (error) {
                console.error('分享失败:', error);
                document.getElementById('shareError').textContent = '分享失败: ' + error.message;
            }
        }
        
        // 返回主页
        function goBack() {
            window.location.href = '/';
        }
        
        // 点击模态框外部关闭
        window.onclick = function(event) {
            const createModal = document.getElementById('createModal');
            const shareModal = document.getElementById('shareModal');
            const uploadModal = document.getElementById('uploadModal');
            
            if (event.target === createModal) {
                closeCreateDialog();
            }
            if (event.target === shareModal) {
                closeShareDialog();
            }
            if (event.target === uploadModal) {
                closeUploadDialog();
            }
        }
    </script>
</body>
</html>
