<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>协作编辑 - NAS</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    body { background: #f7fafc; }
    #editor { height: 70vh; background: #fff; }
    .toolbar { margin-bottom: 10px; }
    .status-bar { margin-top: 10px; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">多人协作编辑</h1>
    <div id="authBox" style="display:none;" class="mb-4">
      <label class="block mb-2">请输入协作密码：</label>
      <input id="pwInput" type="password" class="border px-2 py-1 w-64" />
      <button id="pwBtn" class="bg-blue-600 text-white px-4 py-1 rounded ml-2">进入</button>
      <span id="pwError" class="text-red-600 text-sm ml-2"></span>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <div id="editor"></div>
    <div class="flex gap-2 mt-4">
      <button id="saveBtn" class="bg-blue-600 text-white px-4 py-2 rounded">手动保存</button>
      <span class="status-bar" id="statusBar"></span>
    </div>
    <div class="mt-4 text-sm text-gray-600">当前文件：<span id="fileName"></span></div>
    <div class="mt-2 text-sm text-gray-600">在线用户：<span id="userCount">0</span></div>
  </div>

  <!-- Quill & Yjs & y-websocket & y-quill -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="https://esm.sh/yjs@13.6.9?bundle"></script>
  <script src="https://esm.sh/y-websocket@1.4.5?bundle"></script>
  <script src="https://esm.sh/y-quill@1.0.8?bundle"></script>
  <script src="/static/collab-edit.js"></script>
</body>
</html>
